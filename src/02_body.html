    </div>

  <div class="tiles">
    <button class="tile" onclick="App.enter('admin')">

      <p>Standorte und Kulturen verwalten, Regeln festlegen, Tagesplan prüfen und freigeben.</p>

    <button class="tile wm" onclick="App.enter('wm')">
      <div class="ic">💧</div>

      <div class="sub" id="admSub"></div>
    </div>
    <button class="btn sm" onclick="Store.exportFile()">Sichern</button>
  </div>
  <div class="tabs" id="admTabs"></div>
  <div class="page" id="admPage"></div>
</div>

<!-- ============ WASSERMANN ============ -->
<div id="wmShell" class="shell wm">
  <div class="wmtop">
    <button class="x" onclick="App.home()">←</button>

      <div class="tt" id="wmTitle">Wassermann</div>
      <div class="sub" id="wmSub"></div>
    </div>
    <button class="x" onclick="WM.menu()">⋯</button>
  </div>
  <div class="page" id="wmPage"></div>
  <div id="wmSticky"></div>
</div>
